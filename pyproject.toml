[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-next"
version = "0.1.0"
description = "Aether graph engine (marimo cockpit) — parallel to Tools/aether until Phase 4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "marimo>=0.9.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
